spring:
  application:
    name: notification-service
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: false
      import-check:
        enabled: false
      retry:
        max-attempts: 10
        initial-interval: 3000
        max-interval: 10000
        multiplier: 1.5

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      enabled: false
      fail-fast: false